name: Test BingX TA Context

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BingX symbol, e.g. QTUM or QTUM-USDT"
        required: true
        default: "QTUM"

jobs:
  test-ta:
    runs-on: ubuntu-latest

    env:
      COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
      COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
      ENABLE_BINGX: "true"
      BINGX_BASE_URL: "https://open-api-vst.bingx.com" 
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_MARGIN_USDT: "1"
      BINGX_LEVERAGE: "10"          
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pandas-ta-classic

      - name: Run TA test
        run: |
          python test_ta_context.py --symbol "${{ inputs.symbol }}"
