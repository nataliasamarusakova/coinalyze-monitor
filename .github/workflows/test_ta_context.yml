name: Test BingX TA Context

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "BingX symbol, e.g. QTUM or QTUM-USDT"
        required: true
        default: "QTUM"

jobs:
  test-ta:
    runs-on: ubuntu-latest

    env:
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_BASE_URL: ${{ secrets.BINGX_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pandas-ta-classic

      - name: Run TA test
        run: |
          python test_ta_context.py --symbol "${{ inputs.symbol }}"
