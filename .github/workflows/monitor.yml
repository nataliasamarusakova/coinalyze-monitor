name: Coinalyze Monitor

on:
  repository_dispatch:
    types: [run_monitor]

permissions:
  contents: write

concurrency:
  group: coinalyze-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache LLM model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/qwen3.5-4b-instruct-q4_k_m.gguf
          key: qwen35-4b-instruct-q4km-v1

      - name: Download LLM model if not cached
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L -o models/qwen3.5-4b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen3.5-4B-Instruct-GGUF/resolve/main/qwen3.5-4b-instruct-q4_k_m.gguf"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # ... остальные шаги (Playwright) без изменений ...

      - name: Run monitor
        env:
          COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
          COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LLM_MODEL_PATH: models/qwen3.5-4b-instruct-q4_k_m.gguf
        run: python monitor.py
