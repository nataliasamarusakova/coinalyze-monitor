name: Coinalyze Monitor

on:
  repository_dispatch:
    types: [run_monitor]

permissions:
  contents: write

concurrency:
  group: coinalyze-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache LLM model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: qwen25-1.5b-instruct-q4km-v1

      - name: Download LLM model if not cached
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L -o models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

      - name: Cache Python site-packages
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/Python/3.11.15/x64/lib/python3.11/site-packages
          key: pysite-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}-v1

      - name: Install Python dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Install Playwright browser + OS deps
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" == "true" ]; then
            echo "Chromium уже в кеше, ставлю только системные зависимости..."
            playwright install-deps chromium
          else
            echo "Chromium не найден в кеше, скачиваю с нуля..."
            playwright install --with-deps chromium
          fi

      - name: Run monitor
        env:
          COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
          COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LLM_MODEL_PATH: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        run: python monitor.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_page.html
            debug_screenshot.png
          retention-days: 3

      - name: Commit snapshot log and state
        run: |
          git config user.name "coinalyze-bot"
          git config user.email "actions@github.com"
          git config merge.ours.driver true
          git add snapshots.jsonl heartbeat.jsonl llm_state.json
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            git pull --no-rebase -X ours origin main
          fi
          git push
