name: Coinalyze Monitor

on:
  repository_dispatch:
    types: [run_monitor]

permissions:
  contents: write

concurrency:
  group: coinalyze-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Кэш модели
      - name: Cache LLM model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/Qwen3.5-4B-Q4_K_M.gguf
          key: qwen35-4b-q4km-unsloth-v1

      # Скачивание модели, если нет в кэше
      - name: Download LLM model if not cached
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models

          curl --fail -L \
            -o models/Qwen3.5-4B-Q4_K_M.gguf \
            "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf"

      # ПРОВЕРКА МОДЕЛИ
      - name: Verify LLM model
        run: |
          echo "=== MODELS DIR ==="
          ls -lah models

          echo "=== FILE SIZE ==="
          du -h models/Qwen3.5-4B-Q4_K_M.gguf

          echo "=== FILE TYPE ==="
          file models/Qwen3.5-4B-Q4_K_M.gguf

          echo "=== MAGIC BYTES ==="
          python - <<'PY'
          path = "models/Qwen3.5-4B-Q4_K_M.gguf"
          with open(path, "rb") as f:
              magic = f.read(8)
          print("Magic:", magic)
          if magic[:4] != b"GGUF":
              raise SystemExit("ERROR: file is not a GGUF model")
          PY

      # Кэш pip
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run monitor
        env:
          COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
          COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LLM_MODEL_PATH: models/Qwen3.5-4B-Q4_K_M.gguf
        run: python monitor.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_page.html
            debug_screenshot.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit snapshot log and state
        run: |
          git config user.name "coinalyze-bot"
          git config user.email "actions@github.com"
          git config merge.ours.driver true

          git add snapshots.jsonl heartbeat.jsonl llm_state.json

          git diff --cached --quiet || \
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            git pull --no-rebase -X ours origin main
          fi

          git push
