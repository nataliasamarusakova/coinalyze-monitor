name: Diagnose BingX Orders

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Trading pair symbol"
        required: false
        default: "PROM-USDT"

      page_size:
        description: "How many orders to fetch"
        required: false
        default: "50"

jobs:
  diagnose-bingx-orders:
    runs-on: ubuntu-latest

    env:
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      DIAGNOSE_SYMBOL: ${{ inputs.symbol }}
      DIAGNOSE_PAGE_SIZE: ${{ inputs.page_size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run BingX diagnostics
        run: |
          set -o pipefail
          python diagnose_bingx.py 2>&1 | tee bingx_diagnose_output.txt

      - name: Upload diagnostics output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-diagnose-output-${{ github.run_id }}
          path: bingx_diagnose_output.txt
          retention-days: 7
